# Production — เว็บไซต์ + cloudflared (Cloudflare Tunnel) บน self-hosted server
#   TUNNEL_TOKEN='eyJ...' docker compose -f docker-compose.prod.yml up -d --build
#
# ไม่มี dev code, ไม่ publish host port — เข้าจากภายนอกผ่าน Cloudflare Tunnel เท่านั้น
# (Cloudflare terminate HTTPS ให้ที่ edge → origin เป็น http ธรรมดา, ไม่ต้องเปิดพอร์ต)
#
# tunnel เดียว route ทั้งเว็บ + backend — hostname ตั้งใน Cloudflare dashboard:
#   wbw.<domain>  → http://web:3001     (เว็บนี้)
#   api.<domain>  → http://backend:8080 (su-server)
# backend + Postgres ยกจาก compose ของ ../su-server แยกต่างหาก
name: su-web

services:
  web:
    build:
      context: .
      args:
        # ฝังตอน build — ยิงหา service "backend" บน fullstack-network
        API_UPSTREAM: http://backend:8080/wbw
    image: su-web:latest
    container_name: su-web
    # ไม่ publish host port — cloudflared เข้าถึงผ่าน network ภายในที่ web:3001
    expose:
      - "3001"
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-web
    command: tunnel --no-autoupdate run
    environment:
      # token จาก Cloudflare dashboard — ส่งผ่าน shell env ตอน up (ไม่ commit, ไม่มี .env)
      #   TUNNEL_TOKEN='eyJ...' docker compose -f docker-compose.prod.yml up -d
      # ใช้ :- กันไม่ให้ `down` พังตอน token ไม่ได้ตั้ง (cloudflared จะฟ้องเองอยู่แล้ว)
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - web

networks:
  default:
    # network ที่ su-server สร้าง — join เพื่อให้ web + cloudflared คุยกับ backend:8080 ได้
    name: fullstack-network
    external: true
