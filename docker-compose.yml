# เว็บไซต์อย่างเดียว (Next.js) — ไม่มี backend/database และไม่ใช้ .env ใด ๆ
# backend (Go/su-server) + Postgres รันจาก compose ของ ../su-server เอง
#
# web คุยกับ backend ผ่าน network กลาง "fullstack-network" (su-server เป็นคนสร้าง)
# → ต้องยก stack ของ su-server ขึ้นก่อน network ถึงจะมีให้ join
name: su-web

services:
  web:
    build:
      context: .
      args:
        # ⚠ rewrites ถูก serialize ลง routes-manifest.json ตอน build
        #    → ต้องเป็น build arg (runtime env ไม่มีผล)
        # "backend" = ชื่อ service ใน compose ของ su-server บน network เดียวกัน
        API_UPSTREAM: http://backend:8080/wbw
    container_name: su-web
    ports:
      - "3001:3001"
    restart: unless-stopped

networks:
  default:
    # network ที่ su-server สร้าง — join เข้าไปเพื่อ resolve ชื่อ "backend"
    name: fullstack-network
    external: true
